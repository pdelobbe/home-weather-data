name: hrrr
# A long-running watcher: polls NOAA every 2 minutes and publishes each forecast hour as it is
# posted (hrrr_render.py is incremental and never mixes two runs), re-dispatching itself before
# the 6-hour job limit. The cron is only a backstop —
# GitHub throttles schedules on small repos to every few hours.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: hrrr
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Watch and publish
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Start from what is published so a fresh job continues the current run instead of re-rendering it.
          rm -rf out
          git clone -q --depth 1 -b wx-data "https://github.com/$REPO.git" out 2>/dev/null || mkdir -p out
          rm -rf out/.git
          echo "published: $(jq -r '"\(.run) hours=\(.hours)"' out/meta.json 2>/dev/null || echo none)"
          END=$((SECONDS + 330*60))
          while [ $SECONDS -lt $END ]; do
            python hrrr_render.py out --hours 18 && RC=0 || RC=$?
            if [ $RC = 0 ]; then
              STAMP=$(jq -r '"\(.run) f\(.hours)"' out/meta.json)
              ( cd out && git init -q -b wx-data && git config user.name hrrr-bot && git config user.email "41898282+github-actions[bot]@users.noreply.github.com" &&
                git add -A && git commit -q -m "HRRR $STAMP" &&
                git push -qf "https://x-access-token:${TOKEN}@github.com/${REPO}.git" wx-data ) && echo "$(date -u +%H:%M:%S)Z published $STAMP"
              rm -rf out/.git
            elif [ $RC != 3 ]; then
              echo "$(date -u +%H:%M:%S)Z render failed (exit $RC)"
            fi
            sleep 120
          done
      - name: Chain the next watcher
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run hrrr.yml -R "${{ github.repository }}"
